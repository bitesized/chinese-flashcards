name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: install, typecheck, lint, unit test, licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (includes GPL-3.0 header check)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Licence compatibility check
        run: npm run license-check

      - name: Build data (pipeline stages 1-9, invariant gates)
        run: npm run build:data
        # WO-008: parses CC-CEDICT, matches HSK, validates (fails the build
        # on any testing-strategy.md §3 gate violation not covered by a
        # committed waiver — data/overrides/waived-words.json), and emits
        # public/decks/*.json + data/build/report.md + review-queue.json.

      - name: Fail if the data build drifted from committed output
        run: |
          set -euo pipefail
          for f in public/decks/hsk-*.json; do
            diff <(jq 'del(.meta.builtAt)' "$f") <(git show HEAD:"$f" | jq 'del(.meta.builtAt)')
          done
          git diff --exit-code -- public/decks/manifest.json data/build/review-queue.json
        # Compiled decks are committed (data-pipeline.md §9) specifically so
        # a content change shows up as a reviewable diff. Each deck's own
        # meta.builtAt legitimately differs on every run (same reason
        # data/build/report.md is excluded entirely) so it's stripped
        # before comparing — build-data.test.ts already establishes this is
        # the only field a rebuild is allowed to change. Everything else in
        # the decks, plus the manifest and review queue, must not drift.

      - name: Build CC-CEDICT lookup index (DEC-037, custom-deck word lookup)
        run: npm run build:lookup
        # Independent of build:data (build-lookup.ts's own docstring): reads
        # the pinned CC-CEDICT source directly, emits
        # public/cedict-lookup/{index,detail-*,meta}.json.

      - name: Fail if the lookup build drifted from committed output
        run: |
          set -euo pipefail
          diff <(jq 'del(.builtAt)' public/cedict-lookup/meta.json) \
               <(git show HEAD:public/cedict-lookup/meta.json | jq 'del(.builtAt)')
          git diff --exit-code -- public/cedict-lookup/index.json public/cedict-lookup/detail-*.json
        # Same reasoning as the data-build drift check above: meta.json's
        # own builtAt legitimately differs on every run and is stripped
        # before comparing; the index and every detail shard must not drift.

      # --- Slots for later work orders (testing-strategy.md §7) ---
      #
      # - name: E2E (Playwright)
      #   run: npm run test:e2e
      #   # Added once the journeys in testing-strategy.md §4 exist to run.
      #
      # - name: Accessibility (axe-core)
      #   run: npm run test:a11y
      #   # Added alongside the first components White ships (NFR-6-10).
      #
      # - name: Performance budgets (Lighthouse CI)
      #   run: npx lhci autorun
      #   # Added once there is a build worth budgeting (NFR-1-4).
